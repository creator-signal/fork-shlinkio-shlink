name: Creator Signal CI

on:
  workflow_call:
  pull_request:
    branches:
      - creator-signal/develop
      - creator-signal/main
  push:
    branches:
      - creator-signal/develop
      - creator-signal/main

permissions:
  contents: read

concurrency:
  group: creator-signal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static / ${{ matrix.command }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        command: [lint, format:check, analyze, openapi:validate]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/ci-setup
        with:
          php-version: '8.5'
          extensions-cache-key: creator-signal-static-8.5-${{ matrix.command }}
      - name: Validate locked dependency graph
        run: composer validate --strict --check-lock
      - run: composer ${{ matrix.command }}

  unit-tests:
    name: Unit tests
    uses: ./.github/workflows/ci-tests.yml
    with:
      test-group: unit

  cli-tests:
    name: CLI and provisioning tests
    uses: ./.github/workflows/ci-tests.yml
    with:
      test-group: cli

  api-tests:
    name: API security tests
    uses: ./.github/workflows/ci-tests.yml
    with:
      test-group: api

  database-tests:
    name: Database / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [sqlite:ci, mysql, maria, postgres, ms]
    uses: ./.github/workflows/ci-db-tests.yml
    with:
      platform: ${{ matrix.platform }}

  openapi-contract:
    name: OpenAPI and client contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/ci-setup
        with:
          php-version: '8.5'
          extensions-cache-key: creator-signal-contract-8.5
      - run: composer openapi:inline
      - run: bash bin/creator-signal-verify-contract.sh
      - name: Publish generated OpenAPI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: creator-signal-openapi-${{ github.sha }}
          path: docs/swagger/openapi-inlined.json
          if-no-files-found: error

  dependency-and-secret-scan:
    name: Dependency, secret and filesystem scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/ci-setup
        with:
          php-version: '8.5'
          extensions-cache-key: creator-signal-security-8.5
      - name: Audit locked dependencies
        run: composer audit --locked
      - name: Scan repository dependencies and secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: .git,vendor,build,data/infra/database,data/infra/database_maria,data/infra/database_pg
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Scan production Dockerfile misconfiguration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  container:
    name: Container / amd64 + arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build amd64 candidate for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: creator-signal/shlink:ci
          build-args: SHLINK_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=creator-signal-shlink
          cache-to: type=gha,mode=max,scope=creator-signal-shlink
      - name: Scan built container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: creator-signal/shlink:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Prove arm64 build
        run: >-
          docker buildx build
          --platform linux/arm64
          --build-arg "SHLINK_VERSION=ci-${GITHUB_SHA}"
          --cache-from type=gha,scope=creator-signal-shlink
          --output type=cacheonly
          .
