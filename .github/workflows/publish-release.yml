name: Publish release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    if: github.repository == 'shlinkio/shlink'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: './.github/actions/ci-setup'
        with:
          php-version: ${{ matrix.php-version }}
          extensions-cache-key: publish-swagger-spec-extensions-${{ matrix.php-version }}
          install-deps: 'no'
      - run: ./build.sh "${GITHUB_REF#refs/tags/v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-files-${{ matrix.php-version }}
          path: build

  publish:
    if: github.repository == 'shlinkio/shlink'
    needs: ['build']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: build
      - name: Publish upstream release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          build/*/shlink*_dist.zip
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes

  delete-artifacts:
    if: github.repository == 'shlinkio/shlink'
    needs: ['publish']
    runs-on: ubuntu-24.04
    steps:
      - uses: geekyeggo/delete-artifact@142daa0f3a918e74a4c700b1ffb48887be395588 # v6
        with:
          name: dist-files-*
